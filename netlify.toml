[build]
  functions = "netlify/functions"
  command = "npm run build"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  framework = "#custom"

[functions]
  node_bundler = "esbuild"

# Specific API routes first
[[redirects]]
  from = "/api/auth/verify"
  to = "/.netlify/functions/verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/users/:id/password"
  to = "/.netlify/functions/admin-users-password"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/users/:id/role"
  to = "/.netlify/functions/admin-users-role"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/users/:id"
  to = "/.netlify/functions/admin-users-delete"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/users"
  to = "/.netlify/functions/admin-users"
  status = 200
  force = true

[[redirects]]
  from = "/api/words/random"
  to = "/.netlify/functions/words-random"
  status = 200
  force = true

[[redirects]]
  from = "/api/words/:word"
  to = "/.netlify/functions/words-update"
  status = 200
  force = true

[[redirects]]
  from = "/api/words"
  to = "/.netlify/functions/words-create"
  status = 200
  force = true

# Wildcard fallback for any other /api/* routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200